<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Sinapse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg:#36146F;
    --grad:linear-gradient(180deg,#582197 0%,#36146F 43%,#1D1245 100%);
    --surface:#2A1A57; --surface-2:#321566;
    --ink:#FFFFFF; --muted:rgba(255,255,255,.78); --faint:rgba(255,255,255,.5);
    --line:rgba(255,255,255,.12); --line-strong:rgba(255,255,255,.24);
    --accent:#E9086D; --accent-ink:#FF7FB0; --accent-soft:rgba(233,8,109,.18);
    --gold:#FFAA01; --gold-soft:rgba(255,166,1,.18);
    --mint:#00D9AC;
    --danger:#FF6B6B;
    --shadow:0 5px 12px rgba(0,0,0,.22), 0 20px 44px -22px rgba(0,0,0,.55);
    --radius:24px; --radius-sm:16px; --pill:999px;
    --sans:"Nunito", system-ui, -apple-system, sans-serif;
    --serif:"Nunito", system-ui, sans-serif;
    --read:"Nunito", system-ui, sans-serif;
    --mono:"IBM Plex Mono", ui-monospace, monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--grad);background-attachment:fixed;color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
  button{font-family:inherit;cursor:pointer}
  img{max-width:100%}
  [hidden]{display:none!important}
  ::selection{background:var(--accent-soft)}
  #app{height:100%;display:flex;flex-direction:column}

  .topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 70%, transparent);backdrop-filter:blur(14px);border-bottom:1px solid transparent;display:flex;align-items:center;gap:12px;padding:14px 20px}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .glyph{width:30px;height:30px;flex:none}
  .brand h1{font-family:var(--serif);font-weight:800;font-size:20px;margin:0;letter-spacing:-.01em;line-height:1}
  .brand small{display:block;font-size:11px;color:var(--muted);letter-spacing:.02em;margin-top:2px}
  .top-actions{margin-left:auto;display:flex;align-items:center;gap:6px}
  .icon-btn{width:38px;height:38px;display:grid;place-items:center;border:1px solid transparent;background:color-mix(in srgb,var(--surface) 70%,transparent);border-radius:var(--pill);color:var(--muted);transition:.15s}
  .icon-btn:hover{color:var(--ink);border-color:var(--line-strong)}
  .icon-btn svg{width:18px;height:18px}
  .sync-dot{font-size:11px;font-family:var(--mono);color:var(--muted);display:flex;align-items:center;gap:6px;padding:0 4px;border:none;background:none}
  .sync-dot i{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block}
  .sync-dot.wait i{background:var(--gold)}
  .sync-dot.off i{background:var(--danger)}
  @media(max-width:600px){.sync-dot span{display:none}}

  .shell{flex:1;min-height:0;display:flex;overflow:hidden}
  .rail{width:250px;flex:none;border-right:1px solid transparent;background:transparent;overflow-y:auto;padding:20px 14px 40px}
  .main{flex:1;min-width:0;overflow-y:auto;display:flex;flex-direction:column}
  .main-inner{width:100%;max-width:720px;margin:0 auto;padding:28px 22px 100px;flex:1}
  @media(max-width:820px){
    .rail{display:none}
    .rail.open{display:block;position:fixed;inset:calc(env(safe-area-inset-top,0px) + 66px) 0 0 0;z-index:40;width:auto;border-right:none;border-bottom:1px solid var(--line);background:var(--grad);box-shadow:0 12px 30px rgba(0,0,0,.4)}
    .main-inner{padding:16px 16px 90px}
    .fstrip{display:flex}
  }
  .fstrip{display:none;gap:7px;overflow-x:auto;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface-2)}
  .fstrip::-webkit-scrollbar{height:0}
  .fstrip-chip{flex:none;border:1px solid var(--line-strong);background:var(--surface);color:var(--muted);font-size:12.5px;padding:6px 12px;border-radius:20px;white-space:nowrap;font-family:var(--sans)}
  .fstrip-chip.on{background:var(--accent-soft);border-color:transparent;color:var(--accent-ink);font-weight:600}
  .fstrip-chip span{font-family:var(--mono);font-size:10.5px;opacity:.6;margin-left:3px}
  .fstrip-chip.add{color:var(--accent);border-style:dashed}

  .rail-group{margin-bottom:20px}
  .rail-label{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);padding:0 10px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
  .rail-label button{border:none;background:none;color:var(--accent);font-family:var(--sans);font-size:12px;font-weight:600;padding:2px 4px;border-radius:6px}
  .rail-label button:hover{background:var(--accent-soft)}
  .nav-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:none;background:none;color:var(--ink);padding:8px 10px;border-radius:9px;font-size:14px;font-family:inherit;transition:.12s}
  .nav-item:hover{background:var(--surface)}
  .nav-item.active{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
  .nav-item .em{font-size:15px;width:20px;text-align:center;flex:none}
  .nav-item .ct{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint);font-weight:400}
  .nav-item.active .ct{color:var(--accent-ink)}

  .capture{background:color-mix(in srgb,var(--surface) 88%,transparent);border:1px solid color-mix(in srgb,var(--line) 60%,transparent);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:30px}
  .cap-row{display:flex;gap:12px;align-items:flex-start}
  .capture textarea{width:100%;border:none;background:none;resize:none;color:var(--ink);font-family:var(--read);font-size:16.5px;line-height:1.5;outline:none;min-height:52px}
  .capture textarea::placeholder{color:var(--faint);font-style:italic}
  .capture-foot{display:flex;align-items:center;gap:10px;margin-top:8px;padding-top:10px;border-top:1px solid var(--line);flex-wrap:wrap}
  .capture-dest{font-family:var(--mono);font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:5px}
  .mic-btn{width:48px;height:48px;flex:none;border-radius:50%;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;transition:.15s}
  .mic-btn svg{width:23px;height:23px}
  .mic-btn:hover{background:var(--accent);color:#fff}
  .mic-btn.live{background:var(--danger);border-color:var(--danger);color:#fff;animation:micpulse 1.5s infinite}
  @keyframes micpulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--danger) 50%,transparent)}70%{box-shadow:0 0 0 14px transparent}100%{box-shadow:0 0 0 0 transparent}}
  @media (prefers-reduced-motion: reduce){.mic-btn.live{animation:none}}
  .mic-status{font-size:12.5px;color:var(--danger);font-weight:600}
  .auto-toggle{border:1px solid var(--line-strong);background:var(--surface);color:var(--muted);font-family:var(--mono);font-size:11px;padding:5px 11px;border-radius:20px;display:inline-flex;align-items:center;gap:7px}
  .auto-toggle.on{background:var(--accent-soft);border-color:transparent;color:var(--accent-ink)}
  .auto-toggle .sw{width:13px;height:13px;border-radius:50%;border:2px solid currentColor}
  .auto-toggle.on .sw{background:currentColor}
  .cap-help{font-size:11.5px;color:var(--faint);margin-top:10px;line-height:1.55;background:var(--surface-2);border-radius:8px;padding:8px 11px}
  .cap-help b{color:var(--muted);font-weight:600}
  .btn{border:1px solid var(--accent);background:var(--accent);color:#fff;padding:10px 20px;border-radius:var(--pill);font-weight:600;font-size:13.5px;transition:.15s}
  .btn:hover{filter:brightness(1.06)}
  .btn:disabled{opacity:.45;cursor:default}
  .btn.subtle{background:var(--surface);border-color:var(--line-strong);color:var(--ink)}
  .btn.subtle:hover{background:var(--surface-2)}
  .btn.danger{background:none;border-color:transparent;color:var(--danger)}
  .btn.danger:hover{background:color-mix(in srgb,var(--danger) 12%,transparent)}

  .view-head{display:flex;align-items:baseline;gap:12px;margin-bottom:4px}
  .view-head h2{font-family:var(--serif);font-weight:800;font-size:26px;margin:0;letter-spacing:-.02em}
  .view-head .n{font-family:var(--mono);font-size:12px;color:var(--faint)}
  .view-sub{color:var(--muted);font-size:13.5px;margin:0 0 18px}
  .filter-bar{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
  .chip{border:1px solid var(--line-strong);background:var(--surface);color:var(--muted);font-size:12px;padding:5px 11px;border-radius:20px;font-family:var(--mono);transition:.12s}
  .chip:hover{color:var(--ink)}
  .chip.on{background:var(--accent-soft);border-color:transparent;color:var(--accent-ink);font-weight:500}

  .syncpill{display:flex;align-items:center;gap:6px;border-radius:11px;margin-bottom:16px;font-size:12.5px}
  .syncpill .sp-main{flex:1;min-width:0;text-align:left;border:none;background:none;color:inherit;font:inherit;font-weight:500;padding:9px 12px;cursor:pointer;display:flex;align-items:center;gap:8px}
  .syncpill .sp-main:before{content:'';width:9px;height:9px;border-radius:50%;background:currentColor;flex:none}
  .syncpill.wait .sp-main:before{animation:blink 1.1s infinite}
  @keyframes blink{50%{opacity:.25}}
  .syncpill .sp-check{border:none;background:none;color:inherit;opacity:.65;padding:8px;border-radius:8px;cursor:pointer;flex:none}
  .syncpill .sp-check:hover{opacity:1}
  .syncpill .sp-check svg{width:16px;height:16px;display:block}
  .syncpill.ok{background:var(--accent-soft);color:var(--accent-ink)}
  .syncpill.wait{background:var(--surface-2);color:var(--muted)}
  .syncpill.bad{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}

  .import-banner{background:var(--gold-soft);color:var(--gold);border:1px solid color-mix(in srgb,var(--gold) 30%,transparent);border-radius:var(--radius);padding:14px 16px;margin-bottom:18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .import-banner span{flex:1;min-width:180px;font-size:13.5px;line-height:1.5}

  .notes{display:flex;flex-direction:column;gap:10px}
  .card{background:color-mix(in srgb,var(--surface) 85%,transparent);border:1px solid color-mix(in srgb,var(--line) 55%,transparent);border-radius:var(--radius);padding:18px 20px;transition:.16s;cursor:pointer}
  .card:hover{border-color:var(--line-strong);box-shadow:var(--shadow);transform:translateY(-2px)}
  .card-top{display:flex;align-items:center;gap:8px;margin-bottom:5px}
  .card-top h3{flex:1;min-width:0}
  .card h3{font-family:var(--serif);font-weight:700;font-size:17px;margin:0;letter-spacing:-.01em;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .zid{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-left:8px;flex:none}
  .card .excerpt{color:var(--muted);font-family:var(--read);font-size:14.5px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card-meta{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
  .tag{font-family:var(--mono);font-size:11px;color:var(--accent-ink);background:var(--accent-soft);padding:2px 8px;border-radius:6px}
  .badge{font-family:var(--mono);font-size:10.5px;padding:2px 7px;border-radius:6px;display:inline-flex;align-items:center;gap:4px}
  .badge.inbox{background:var(--gold-soft);color:var(--gold)}
  .badge.link{background:var(--surface-2);color:var(--muted)}
  .card .folder-tag{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:auto}

  .empty{text-align:center;padding:60px 20px;color:var(--muted)}
  .empty .big{font-size:34px;margin-bottom:12px;opacity:.6}
  .empty h3{font-family:var(--serif);font-weight:500;color:var(--ink);margin:0 0 6px;font-size:19px}
  .empty p{margin:0 auto;max-width:340px;font-size:14px;line-height:1.55}

  .detail-nav{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
  .back{display:inline-flex;align-items:center;gap:6px;border:none;background:none;color:var(--muted);font-size:13.5px;font-family:inherit;padding:6px 4px}
  .back:hover{color:var(--ink)}
  .detail-nav .sp{margin-left:auto;display:flex;gap:6px}
  .zbar{font-family:var(--mono);font-size:11px;color:var(--faint);margin-bottom:14px;display:flex;gap:14px;flex-wrap:wrap}
  .d-title{width:100%;border:none;background:none;font-family:var(--serif);font-weight:800;font-size:27px;letter-spacing:-.02em;color:var(--ink);outline:none;line-height:1.15;margin-bottom:6px}
  .d-title::placeholder{color:var(--faint)}
  .d-body{width:100%;border:none;background:none;font-family:var(--read);font-size:17px;line-height:1.65;color:var(--ink);outline:none;resize:none;min-height:220px}
  .d-body::placeholder{color:var(--faint);font-style:italic}
  .rendered{font-family:var(--read);font-size:17px;line-height:1.7;color:var(--ink)}
  .rendered p{margin:0 0 .8em}
  .rendered ul{margin:0 0 .8em;padding-left:1.3em}
  .rendered li{margin-bottom:.3em}
  .rendered strong{font-weight:600}
  .rendered mark{background:var(--gold-soft);color:inherit;padding:.05em .15em;border-radius:3px}
  .rendered a.wl{color:var(--accent);text-decoration:none;border-bottom:1.5px solid var(--accent-soft);cursor:pointer;font-family:var(--sans);font-size:.92em;font-weight:500}
  .rendered a.wl:hover{border-color:var(--accent)}
  .rendered a.wl.missing{color:var(--muted);border-color:var(--line-strong);border-bottom-style:dashed}
  .editrow{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin:18px 0;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .field{display:flex;flex-direction:column;gap:5px}
  .field label{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
  select,.taginput{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 10px;font-family:var(--sans);font-size:13.5px;outline:none}
  select:focus,.taginput:focus{border-color:var(--accent)}
  .taginput{min-width:180px}
  .connections{margin-top:26px}
  .conn-block{margin-bottom:20px}
  .conn-h{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:9px;display:flex;align-items:center;gap:7px}
  .conn-h svg{width:14px;height:14px;color:var(--accent)}
  .conn-list{display:flex;flex-direction:column;gap:6px}
  .conn-item{display:flex;align-items:center;gap:9px;padding:9px 12px;background:var(--surface);border:1px solid var(--line);border-radius:9px;font-size:14px;transition:.12s;cursor:pointer}
  .conn-item:hover{border-color:var(--accent);background:var(--accent-soft)}
  .conn-item .ct-title{font-family:var(--serif);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .conn-item .ct-folder{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--faint);flex:none}
  .conn-empty{font-size:13px;color:var(--faint);font-style:italic}
  .rede-intro{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:22px;font-size:14px;color:var(--muted);line-height:1.6}
  .tagcloud{display:flex;flex-wrap:wrap;gap:9px;align-items:baseline;margin-bottom:28px}
  .tagcloud button{border:none;background:var(--accent-soft);color:var(--accent-ink);border-radius:20px;padding:6px 14px;font-family:var(--mono);transition:.13s;line-height:1.2}
  .tagcloud button:hover{background:var(--accent);color:#fff}
  .stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:28px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px 16px}
  .stat .v{font-family:var(--serif);font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1}
  .stat .k{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:6px;letter-spacing:.03em}
  .searchbox{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;padding:11px 15px;margin-bottom:20px;box-shadow:var(--shadow)}
  .searchbox svg{width:19px;height:19px;color:var(--muted);flex:none}
  .searchbox input{border:none;background:none;outline:none;color:var(--ink);font-size:16px;font-family:var(--sans);width:100%}
  .searchbox input::placeholder{color:var(--faint)}
  .hl{background:var(--gold-soft);border-radius:2px;padding:0 1px}

  .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:13px;padding:9px 16px;border-radius:22px;z-index:60;opacity:0;transition:.25s;pointer-events:none;box-shadow:var(--shadow);max-width:90vw;text-align:center}
  .toast.show{opacity:1}
  .modal-bg{position:fixed;inset:0;background:rgba(8,7,22,.62);backdrop-filter:blur(3px);z-index:1000;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:24px 16px}
  .modal{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);width:100%;max-width:400px;margin:0 auto;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.55)}
  body.modal-open{overflow:hidden}
  .modal h3{font-family:var(--serif);font-weight:600;font-size:20px;margin:0 0 16px}
  .modal .field{margin-bottom:14px}
  .modal .field input,.modal .field select{width:100%;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--ink);border-radius:8px;padding:9px 11px;font-size:14px;font-family:var(--sans);outline:none}
  .modal .field input:focus{border-color:var(--accent)}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
  .seg{display:flex;gap:6px}
  .seg button{flex:1;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--muted);border-radius:8px;padding:9px;font-size:13px;font-family:inherit}
  .seg button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
  .cover-pick{width:92px;height:130px;flex:none;border:1.5px dashed var(--line-strong);border-radius:12px;display:grid;place-items:center;cursor:pointer;overflow:hidden;background:var(--surface-2);color:var(--faint);font-size:12px;text-align:center;line-height:1.3}
  .cover-pick img{width:100%;height:100%;object-fit:cover}
  .book-hero{display:flex;gap:16px;align-items:flex-end;margin-bottom:12px}
  .book-cover{width:88px;height:124px;flex:none;object-fit:cover;border-radius:12px;box-shadow:var(--shadow);background:var(--surface-2)}
  .book-cover.ph{display:grid;place-items:center;font-size:38px}
  .book-meta{min-width:0}
  .book-meta h2{font-family:var(--serif);font-weight:800;font-size:24px;margin:0 0 4px;letter-spacing:-.02em;line-height:1.12}
  .book-author{color:var(--muted);font-size:14px;margin-bottom:6px}
  .book-meta .n{font-family:var(--mono);font-size:12px;color:var(--faint)}
  .railcover{width:20px;height:26px;object-fit:cover;border-radius:3px;display:block}
  .shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:20px}
  .shelf-book{border:none;background:none;text-align:left;cursor:pointer;color:var(--ink);font-family:inherit;padding:0;min-width:0}
  .shelf-cover{width:100%;aspect-ratio:3/4.3;object-fit:cover;border-radius:12px;box-shadow:var(--shadow);background:var(--surface-2);display:block;transition:.16s}
  .shelf-book:hover .shelf-cover{transform:translateY(-4px)}
  .shelf-cover.ph{display:grid;place-items:center;font-size:40px}
  .shelf-cover.ph.add{border:1.5px dashed var(--line-strong);font-size:34px;color:var(--faint);box-shadow:none}
  .shelf-title{font-family:var(--serif);font-weight:700;font-size:14px;margin-top:8px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .shelf-author{font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .shelf-count{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:3px}

  /* ============ markdown ============ */
  function mdInline(s){
    s=esc(s);

    s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');

    s=s.replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>');
    return s;
  }
  function renderMd(text){
    var lines=(text||'').split('\n'),html='',inList=false;
    for(var i=0;i<lines.length;i++){var ln=lines[i];
      if(/^\s*[-*]\s+/.test(ln)){if(!inList){html+='<ul>';inList=true;}html+='<li>'+mdInline(ln.replace(/^\s*[-*]\s+/,''))+'</li>';}

  }

  /* ============ connections ============ */
  function outgoing(note){var out=[],seen={},m,re=/\[\[([^\]]+)\]\]/g,b=note.body||'';while((m=re.exec(b))){var t=m[1].trim().toLowerCase();if(seen[t])continue;seen[t]=1;var n=noteByTitle(m[1].trim());if(n&&n.id!==note.id)out.push(n);}return out;}
  function backlinks(note){var t=(note.title||'').trim();if(!t)return [];var re=new RegExp('\\[\\[\\s*'+reRe(t)+'\\s*\\]\\]','i');return notes.filter(function(n){return n.id!==note.id&&re.test(n.body||'');});}
  function tokenize(s){return (s||'').toLowerCase().split(/[^a-zà-ú0-9]+/).filter(function(w){return w.length>3 && STOP.indexOf(w)<0 && !/^\d+$/.test(w);});}
  function noteTokens(n){var m={};tokenize(n.title).forEach(function(w){m[w]=(m[w]||0)+3;});(n.tags||[]).forEach(function(t){tokenize(t).forEach(function(w){m[w]=(m[w]||0)+4;});});tokenize(n.body).forEach(function(w){m[w]=(m[w]||0)+1;});return m;}
  function related(note){
    var mine=noteTokens(note);var keys=Object.keys(mine);if(!keys.length)return [];
    var ex={};ex[note.id]=1;outgoing(note).concat(backlinks(note)).forEach(function(n){ex[n.id]=1;});
    var mineTags=note.tags||[];
    var sc=notes.filter(function(n){return !ex[n.id];}).map(function(n){
      var t=noteTokens(n),s=0;for(var k in t){if(mine[k])s+=Math.min(mine[k],t[k]);}
      var shTags=(n.tags||[]).filter(function(x){return mineTags.indexOf(x)>=0;}).length;s+=shTags*5;
      return {n:n,s:s};
    }).filter(function(o){return o.s>=3;});
    sc.sort(function(a,b){return b.s-a.s||(b.n.updatedAt||0)-(a.n.updatedAt||0);});
    return sc.slice(0,6).map(function(o){return o.n;});
  }
  function allTags(){var map={};notes.forEach(function(n){(n.tags||[]).forEach(function(t){map[t]=(map[t]||0)+1;});});return Object.keys(map).map(function(t){return {tag:t,count:map[t]};}).sort(function(a,b){return b.count-a.count||a.tag.localeCompare(b.tag);});}
  function linkCount(){var c=0;notes.forEach(function(n){c+=outgoing(n).length;});return c;}
  var STOP=' a o as os um uma uns umas de do da dos das em no na nos nas por para com sem sob sobre ao aos e ou mas que se como quando onde qual quais quem cujo the of to and in is it its this that these those você seu sua seus suas para mais menos muito pouco também já não sim isso isto esse essa este esta aquilo '.split(' ');
  function autoTags(text,max){
    max=max||3;
    var base=plain(text||'').toLowerCase();
    var toks=base.split(/[^a-zà-ú0-9]+/).filter(function(w){return w.length>3&&w.length<26&&STOP.indexOf(w)<0&&!/^\d+$/.test(w);});
    if(toks.length<3)return [];
    var tf={};toks.forEach(function(w){tf[w]=(tf[w]||0)+1;});
    var bg={};for(var i=0;i<toks.length-1;i++){var b=toks[i]+' '+toks[i+1];bg[b]=(bg[b]||0)+1;}
    var corpus=notes.map(function(n){return plain((n.title||'')+' '+(n.body||'')).toLowerCase();});
    var N=Math.max(1,corpus.length);
    function df(term){var c=0;for(var j=0;j<corpus.length;j++){if(corpus[j].indexOf(term)>=0)c++;}return c;}
    var scored=[];
    Object.keys(tf).forEach(function(w){var idf=Math.log((N+1)/(1+df(w)))+1;scored.push({t:w,s:tf[w]*idf});});
    Object.keys(bg).forEach(function(b){var p=b.split(' ');if(p[0]===p[1])return;var idf=Math.log((N+1)/(1+df(b)))+1;scored.push({t:b,s:bg[b]*idf*1.7});});
    scored.sort(function(a,b){return b.s-a.s||a.t.localeCompare(b.t);});
    var out=[];
    for(var k=0;k<scored.length&&out.length<max;k++){var t=scored[k].t;if(out.some(function(o){return o.indexOf(t)>=0||t.indexOf(o)>=0;}))continue;out.push(t);}
    return out;
  }

  /* ============ Supabase storage ============ */
  function fromDbNote(r){return {id:r.id,title:r.title,body:r.body,folderId:r.folder_id,status:r.status,tags:r.tags||[],createdAt:Number(r.created_at)||0,updatedAt:Number(r.updated_at)||0};}

  function resizeImage(file,max,cb){try{var img=new Image();var url=URL.createObjectURL(file);img.onload=function(){var w=img.width,h=img.height,sc=Math.min(1,max/Math.max(w,h));var cw=Math.round(w*sc),ch=Math.round(h*sc);var c=document.createElement('canvas');c.width=cw;c.height=ch;c.getContext('2d').drawImage(img,0,0,cw,ch);URL.revokeObjectURL(url);try{cb(c.toDataURL('image/jpeg',0.72));}catch(e){cb(null);}};img.onerror=function(){URL.revokeObjectURL(url);cb(null);};img.src=url;}catch(e){cb(null);}}

        sb.auth.getSession().then(function(s){ if(s.data&&s.data.session)onSignedIn(s.data.session); else { setSignMode('in'); showAuth('Senha alterada! Agora é só entrar.','ok'); } });
      }).catch(function(){ $('#authBtn').disabled=false; showAuth('Erro de conexão. Tente de novo.','err'); });

      $('#authBtn').disabled=false; setSignMode(signMode);
      if(r.error){ showAuth(traduzErro(r.error.message),'err'); return; }
      if(signMode==='up' && !r.data.session){ showAuth('Conta criada! Confirme pelo link enviado ao seu e-mail e depois entre.','ok'); setSignMode('in'); return; }
      /* sucesso: onAuthStateChange cuida do resto */
    }).catch(function(){ $('#authBtn').disabled=false; setSignMode(signMode); showAuth('Erro de conexão. Tente de novo.','err'); });
  }
  function traduzErro(m){
    m=(m||'').toLowerCase();
    if(m.indexOf('invalid login')>=0||m.indexOf('invalid credentials')>=0)return 'E-mail ou senha incorretos.';
    if(m.indexOf('already registered')>=0||m.indexOf('already exists')>=0)return 'Esse e-mail já tem conta. Escolha "Entrar".';
    if(m.indexOf('email not confirmed')>=0)return 'Confirme seu e-mail pelo link que enviamos, depois entre.';
    if(m.indexOf('password')>=0)return 'Senha muito curta ou inválida (mín. 6 caracteres).';
    return 'Não deu certo: '+m;
  }

  function currentDest(){var b=$('[data-act=capture]');return b?b.getAttribute('data-dest'):(view.folderId||'inbox');}

  function showVoiceHelp(t){var s=$('#micStatus');if(s){s.style.color='var(--muted)';s.textContent=t;}toast(t);}
  function requestWake(){try{if(navigator.wakeLock&&navigator.wakeLock.request){navigator.wakeLock.request('screen').then(function(w){wakeLock=w;}).catch(function(){});}}catch(e){}}
  function releaseWake(){try{if(wakeLock){wakeLock.release();wakeLock=null;}}catch(e){}}
  function ensureRecog(){
    if(recog||!recogSupported)return recog;
    recog=new SR();recog.lang='pt-BR';recog.continuous=true;recog.interimResults=true;
    recog.onstart=function(){micStarted=true;clearTimeout(micStartTimer);setMicUI(true);};
    recog.onaudiostart=function(){micStarted=true;};
    recog.onresult=function(e){var interim='',add='';for(var i=e.resultIndex;i<e.results.length;i++){var tr=e.results[i][0].transcript;if(e.results[i].isFinal)add+=tr;else interim+=tr;}if(add){add=add.trim();capBase=(capBase?capBase+' ':'')+add.charAt(0).toUpperCase()+add.slice(1);}var box=$('#cap');if(box){box.value=(capBase+(interim?' '+interim:'')).trim();box.style.height='auto';box.style.height=box.scrollHeight+'px';}};
    recog.onerror=function(e){if(e.error==='no-speech')return;var msg={'not-allowed':'Microfone bloqueado. Toque no campo e use o 🎤 do teclado.','service-not-allowed':'Microfone bloqueado. Use o 🎤 do teclado.','audio-capture':'Nenhum microfone encontrado.','network':'Sem conexão para reconhecimento.'}[e.error];wantListening=false;clearTimeout(micStartTimer);setMicUI(false);releaseWake();showVoiceHelp(msg||'Não consegui usar o microfone. Use o 🎤 do teclado.');};
    recog.onend=function(){if(wantListening){try{recog.start();}catch(e){}return;}setMicUI(false);releaseWake();if(autoVoice&&capBase.trim())doCapture(currentDest());};
    return recog;
  }
  function startMic(){if(!ensureRecog()){showVoiceHelp('Este navegador não tem ditado próprio. Use o 🎤 do teclado.');return;}var box=$('#cap');capBase=box&&box.value.trim()?box.value.trim():'';wantListening=true;micStarted=false;setMicUI(true);try{recog.start();requestWake();}catch(e){wantListening=false;setMicUI(false);showVoiceHelp('Não consegui abrir o microfone. Use o 🎤 do teclado.');return;}clearTimeout(micStartTimer);micStartTimer=setTimeout(function(){if(wantListening&&!micStarted){wantListening=false;try{recog.stop();}catch(e){}setMicUI(false);releaseWake();showVoiceHelp('O microfone não abriu. Toque no campo e use o 🎤 do teclado.');}},2500);}
  function toggleMic(){if(wantListening){wantListening=false;try{recog.stop();}catch(e){}}else startMic();}
  function abortMic(){if(wantListening){wantListening=false;try{recog.stop();}catch(e){}}capBase='';releaseWake();setMicUI(false);}

  function searchView(){
    var q=view.q.trim().toLowerCase();
    var h='<div class="searchbox">'+ic('search')+'<input id="sq" placeholder="Puxar um assunto que você já leu..." value="'+esc(view.q)+'" autocomplete="off"></div>';
    var tags=allTags();
    if(tags.length)h+='<div class="filter-bar">'+tags.slice(0,14).map(function(t){return '<button class="chip'+(view.tag===t.tag?' on':'')+'" data-act="ftag" data-tag="'+esc(t.tag)+'">#'+esc(t.tag)+' '+t.count+'</button>';}).join('')+'</div>';
    var res=notes.slice();
    if(view.tag)res=res.filter(function(n){return (n.tags||[]).indexOf(view.tag)>=0;});
    if(q){
      var terms=q.split(/\s+/).filter(Boolean);
      res=res.map(function(n){
        var ti=(n.title||'').toLowerCase(),bo=(n.body||'').toLowerCase(),tg=(n.tags||[]).join(' ').toLowerCase();var s=0;
        terms.forEach(function(w){ if(ti.indexOf(w)>=0)s+=10; if(tg.indexOf(w)>=0)s+=6; if(bo.indexOf(w)>=0)s+=3; });
        if(ti.indexOf(q)>=0)s+=8; if(bo.indexOf(q)>=0)s+=2;
        return {n:n,s:s};
      }).filter(function(o){return o.s>0;}).sort(function(a,b){return b.s-a.s||(b.n.updatedAt||0)-(a.n.updatedAt||0);}).map(function(o){return o.n;});
    }
    else if(!view.tag){ h+='<div class="empty"><div class="big">'+ic('search')+'</div><h3>Seu buscador pessoal</h3><p>Digite um tema, autor ou conceito. A Sinapse procura em todos os títulos, textos e etiquetas.</p></div>'; return h; }
    h+='<div class="view-head" style="margin-bottom:14px"><h2 style="font-size:20px">'+res.length+' resultado'+(res.length!==1?'s':'')+'</h2>'+(view.tag?'<span class="n">#'+esc(view.tag)+'</span>':'')+'</div>';
    if(!res.length)h+='<div class="empty"><p>Nada encontrado. Tente outro termo.</p></div>';else h+='<div class="notes">'+res.map(function(n){return searchCard(n,q);}).join('')+'</div>';
    return h;

  function searchCard(n,q){
    var f=folderById(n.folderId);var body=plain(n.body);var snip=body;
    if(q){var i=body.toLowerCase().indexOf(q);if(i>=0){var st=Math.max(0,i-40);snip=(st>0?'…':'')+body.slice(st,i+q.length+90);}}
    snip=esc(snip.slice(0,160));if(q)snip=snip.replace(new RegExp('('+reRe(esc(q))+')','ig'),'<span class="hl">$1</span>');
    var title=esc(n.title||'Sem título');if(q)title=title.replace(new RegExp('('+reRe(esc(q))+')','ig'),'<span class="hl">$1</span>');
    var h='<div class="card" data-act="open" data-id="'+n.id+'"><div class="card-top"><h3>'+title+'</h3><span class="zid">'+zettelId(n.createdAt)+'</span></div>';
    if(snip)h+='<div class="excerpt">'+snip+'</div>';

  function parseCSV(text){
    var rows=[],row=[],cur='',q=false,i,c;
    text=(text||'').replace(/\r\n/g,'\n').replace(/\r/g,'\n');
    for(i=0;i<text.length;i++){c=text[i];
      if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
      else { if(c==='"')q=true; else if(c===','){row.push(cur);cur='';} else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur='';} else cur+=c; }
    }
    if(cur.length||row.length){row.push(cur);rows.push(row);}
    return rows;
  }
  function csvKey(h){h=(h||'').trim().toLowerCase();
    if(/^(livro|book|obra)/.test(h))return 'book';
    if(/(autor|author)/.test(h))return 'author';
    if(/(etiqueta|tag)/.test(h))return 'tags';
    if(/(p[aá]gina|page|local|location|posi)/.test(h))return 'page';
    if(/(nota|highlight|destaque|trecho|texto|content|trecho|clip)/.test(h))return 'body';
    if(/(t[ií]tulo|title|assunto)/.test(h))return 'title';
    return null;
  }
  function buildImportPlan(text){
    var rows=parseCSV(text).filter(function(r){return r.length && r.join('').trim()!=='';});
    if(rows.length<2)return null;
    var head=rows[0].map(csvKey);
    if(head.indexOf('book')<0 && head.indexOf('body')<0) return {error:'Cabeçalho não reconhecido. Use colunas como: livro, nota (e opcionais autor, titulo, etiquetas, pagina).'};
    var byName={}; folders.forEach(function(f){if(f.type==='book')byName[(f.name||'').toLowerCase()]=f;});
    var newFolders=[],newNotes=[],skipped=0,used={};
    for(var r=1;r<rows.length;r++){
      var o={};for(var c=0;c<rows[r].length;c++){var k=head[c];if(k)o[k]=(rows[r][c]||'').trim();}
      if(!(o.body||o.title)){skipped++;continue;}
      var bookName=(o.book||'Importados').trim()||'Importados';var key=bookName.toLowerCase();used[key]=1;
      var f=byName[key];
      if(!f){f={id:uidGen('f'),name:bookName,type:'book',icon:'book',author:o.author||'',cover:'',order:folders.length+newFolders.length,createdAt:now()};byName[key]=f;newFolders.push(f);}
      var body=o.body||'';if(o.page)body+=(body?'\n\n':'')+'— '+o.page;
      var title=o.title||(body?body.replace(/\n/g,' ').slice(0,70).trim()+(body.length>70?'…':''):'Nota');
      var tags=o.tags?o.tags.split(/[;|]/).map(function(s){return s.trim().toLowerCase();}).filter(Boolean):[];
      newNotes.push({id:uidGen('n'),title:title,body:body,folderId:f.id,status:'kept',tags:tags,createdAt:now(),updatedAt:now()});
    }
    return {folders:newFolders,notes:newNotes,skipped:skipped,books:Object.keys(used).length};
  }
  function runImport(plan){
    plan.folders.forEach(function(f){folders.push(f);});
    plan.notes.forEach(function(n){notes.unshift(n);});
    render();
    if(sb){
      var chunk=function(a,n){var o=[];for(var i=0;i<a.length;i+=n)o.push(a.slice(i,i+n));return o;};
      var p=Promise.resolve();
      if(plan.folders.length)p=p.then(function(){return sb.from('folders').upsert(plan.folders.map(toDbFolder));});
      chunk(plan.notes.map(toDbNote),200).forEach(function(ch){p=p.then(function(){return sb.from('notes').upsert(ch);});});
      p.then(function(){toast('Importado ✓ '+plan.notes.length+' notas');}).catch(function(e){toast('Erro ao importar: '+((e&&e.message)||'tente de novo'));});
    } else { toast('Importado (demo) ✓ '+plan.notes.length+' notas'); }
  }

      var seg=e.target.closest('#seg button');
      if(seg){cur.type=seg.getAttribute('data-t');$('#seg').querySelectorAll('button').forEach(function(b){b.classList.toggle('on',b===seg);});$('#authorField').style.display=cur.type==='book'?'':'none';if(cur.type==='book'&&cur.icon==='folder')cur.icon='book';else if(cur.type==='general'&&cur.icon==='book')cur.icon='folder';m.querySelectorAll('.icon-choice').forEach(function(x){x.classList.toggle('on',x.getAttribute('data-icon')===cur.icon);});return;}
      var act=e.target.closest('[data-act]');if(!act)return;var a=act.getAttribute('data-act');
      if(a==='close-modal'){close();}
      if(a==='save-folder'){
        var name=($('#f-name').value||'').trim();if(!name){toast('Dê um nome.');return;}
        var editId=act.getAttribute('data-id');var t=existing?existing.type:cur.type;
        if(!editId){var dup=folders.some(function(x){return (x.name||'').trim().toLowerCase()===name.toLowerCase()&&x.type===t;});if(dup&&!confirm('Já existe uma pasta "'+name+'". Criar assim mesmo?'))return;}
        var id=editId||uidGen('f');
        var f={id:id,name:name,type:t,icon:cur.icon||'folder',author:t==='book'&&$('#f-author')?$('#f-author').value.trim():'',cover:cur.cover||'',order:existing?existing.order:folders.length,createdAt:existing?existing.createdAt:now()};
        saveFolder(f);close();view={name:'folder',folderId:id,noteId:null,tag:null,q:''};render();toast('Pasta salva na nuvem ✓');
      }
    });
    setTimeout(function(){var el=$('#f-name');if(el)el.focus();},50);
  }

  /* ============ events ============ */
  function wire(){
    var cap=$('#cap');
    if(cap){var g=function(){cap.style.height='auto';cap.style.height=Math.max(52,cap.scrollHeight)+'px';};cap.addEventListener('input',g);cap.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();doCapture(currentDest());}});}
    var sq=$('#sq');
    if(sq){sq.focus();if(sq.value)sq.setSelectionRange(sq.value.length,sq.value.length);sq.addEventListener('input',function(){view.q=sq.value;var mi=$('.main-inner');mi.innerHTML=syncPill()+searchView();wire();});}
    app.onclick=function(e){
      var link=e.target.closest('a.wl');if(link){e.preventDefault();openWikilink(link.getAttribute('data-link'));return;}
      var el=e.target.closest('[data-act]');if(!el)return;var a=el.getAttribute('data-act'),id=el.getAttribute('data-id'),tag=el.getAttribute('data-tag');
      if(['folder','rede','go-search','open','back','edit','del-folder','new-book','new-folder','signout','library'].indexOf(a)>=0)abortMic();
      switch(a){
        case 'menu':var r=$('#rail');if(r)r.classList.toggle('open');break;
        case 'library':editing=false;view={name:'library',folderId:view.folderId,noteId:null,tag:null,q:''};closeRail();render();break;
        case 'theme':toggleTheme();break;
        case 'recheck':toast('Atualizando…');loadAll(function(){toast('Atualizado ✓');});break;
        case 'signout':if(confirm('Sair da sua conta neste aparelho?')){sb.auth.signOut();}break;
        case 'folder':editing=false;view={name:'folder',folderId:id,noteId:null,tag:null,q:''};closeRail();render();break;
        case 'rede':editing=false;view={name:'rede',folderId:view.folderId,noteId:null,tag:null,q:''};closeRail();render();break;
        case 'go-search':editing=false;view={name:'search',folderId:view.folderId,noteId:null,tag:null,q:view.q};closeRail();render();break;
        case 'open':editing=false;view={name:'note',folderId:view.folderId,noteId:id,tag:null,q:view.q};render();window.scrollTo(0,0);break;
        case 'back':editing=false;view.name=view.q?'search':'folder';view.noteId=null;render();break;
        case 'capture':doCapture(el.getAttribute('data-dest'));break;
        case 'mic':toggleMic();break;
        case 'toggle-auto':autoVoice=!autoVoice;try{localStorage.setItem('sinapse_autovoice',autoVoice?'1':'0');}catch(e){}el.classList.toggle('on',autoVoice);break;
        case 'edit':editing=true;render();setTimeout(function(){var b=$('#e-body');if(b){b.style.height=b.scrollHeight+'px';}},30);break;
        case 'save':doSave();break;
        case 'del-note':if(confirm('Excluir esta nota? Não dá pra desfazer.')){removeNote(id);editing=false;view.name=view.q?'search':'folder';view.noteId=null;render();toast('Nota excluída.');}break;
        case 'new-book':openFolderModal('book');break;
        case 'import-csv':openImportModal();break;
        case 'new-folder':openFolderModal('general');break;
        case 'edit-folder':openFolderModal(null,folderById(id));break;
        case 'del-folder':var fx=folderById(id);if(fx&&confirm('Excluir a pasta "'+fx.name+'"? As notas voltam pro Inbox.')){removeFolder(id);view={name:'folder',folderId:'inbox',noteId:null,tag:null,q:''};render();toast('Pasta excluída.');}break;
        case 'tag':case 'ftag':view={name:'search',folderId:view.folderId,noteId:null,tag:tag,q:''};closeRail();render();break;
        case 'add-tag':var ti=$('#e-tags');if(ti){var curr=ti.value.split(',').map(function(s){return s.trim();}).filter(Boolean);if(curr.indexOf(tag)<0)curr.push(tag);ti.value=curr.join(', ');el.style.display='none';}break;
        case 'import':importSeed();break;
        case 'dismiss-import':try{localStorage.setItem('sinapse_imported','1');}catch(e){}render();break;
      }
    };
    var eb=$('#e-body');if(eb){var grow=function(){eb.style.height='auto';eb.style.height=Math.max(220,eb.scrollHeight)+'px';};eb.addEventListener('input',grow);grow();}
    if(wantListening){var b=$('#cap');if(b)b.value=capBase;setMicUI(true);}
  }
  function closeRail(){var r=$('#rail');if(r)r.classList.remove('open');}
  function doCapture(destId){
    if(wantListening){wantListening=false;try{recog.stop();}catch(e){}releaseWake();}
    var cap=$('#cap');var text=cap?cap.value.trim():capBase.trim();capBase='';
    if(!text){toast('Escreva ou fale algo primeiro.');return;}
    var lines=text.split('\n');
    var title=lines[0].replace(/^#+\s*/,'').trim();
    var body=lines.length>1?lines.slice(1).join('\n').trim():'';
    if(!title)title='Sem título';
    var dest=folderById(destId)||folderById('inbox');
    var n={id:uidGen('n'),title:title||'Sem título',body:body,folderId:dest?dest.id:'inbox',status:dest&&dest.type!=='inbox'?'kept':'inbox',tags:autoTags((title||'')+' '+body,3),createdAt:now(),updatedAt:now()};
    saveNote(n);if(cap)cap.value='';render();toast(savedMsg('Capturado')+(n.tags.length?' · '+n.tags.length+' etiquetas':''));
  }
  function doSave(){
    var n=noteById(view.noteId);if(!n)return;var t=$('#e-title'),b=$('#e-body'),fo=$('#e-folder'),tg=$('#e-tags');
    n.title=(t?t.value:n.title).trim()||'Sem título';n.body=b?b.value:n.body;
    if(fo){var nf=fo.value;if(nf!==n.folderId){n.folderId=nf;var ff=folderById(nf);if(ff&&ff.type!=='inbox')n.status='kept';}}
    if(tg)n.tags=tg.value.split(',').map(function(s){return s.trim().toLowerCase();}).filter(Boolean).filter(function(v,i,arr){return arr.indexOf(v)===i;});
    if(!n.tags||!n.tags.length)n.tags=autoTags((n.title||'')+' '+(n.body||''),3);
    saveNote(n);editing=false;render();toast(savedMsg('Salvo'));
  }
  function openWikilink(title){
    var n=noteByTitle(title);
    if(n){editing=false;view={name:'note',folderId:view.folderId,noteId:n.id,tag:null,q:''};render();window.scrollTo(0,0);}
    else if(confirm('A nota "'+title+'" não existe. Criar agora?')){var cur=noteById(view.noteId);var nn={id:uidGen('n'),title:title,body:'',folderId:cur?cur.folderId:'inbox',status:'inbox',tags:[],createdAt:now(),updatedAt:now()};saveNote(nn);editing=true;view={name:'note',folderId:view.folderId,noteId:nn.id,tag:null,q:''};render();}
  }
  function toggleTheme(){var cur=document.documentElement.getAttribute('data-theme');var next=cur==='dark'?'light':cur==='light'?'dark':(matchMedia('(prefers-color-scheme: dark)').matches?'light':'dark');document.documentElement.setAttribute('data-theme',next);try{localStorage.setItem('sinapse_theme',next);}catch(e){}render();}

  /* ============ demo ============ */
  function seedDemo(){
    var d=86400000, h=3600000;
    folders=[
      {id:'inbox',name:'Inbox',type:'inbox',icon:'inbox',author:'',order:0,createdAt:now()-d*10},
      {id:'geral',name:'Geral',type:'general',icon:'folder',author:'',order:1,createdAt:now()-d*10},
      {id:'b1',name:'A Coragem de Ser Imperfeito',type:'book',icon:'book',author:'Brené Brown',order:2,createdAt:now()-d*8},
      {id:'b2',name:'Sapiens',type:'book',icon:'compass',author:'Yuval Harari',order:3,createdAt:now()-d*5},
      {id:'g1',name:'Ideias soltas',type:'general',icon:'bulb',author:'',order:4,createdAt:now()-d*4}
    ];
    notes=[
      {id:'n1',title:'Vulnerabilidade é coragem',body:'Brené define vulnerabilidade como **incerteza, risco e exposição emocional** — não como fraqueza. Tema que conversa com [[Vergonha vs culpa]] e [[Wholehearted living]].',folderId:'b1',status:'kept',tags:['vulnerabilidade','coragem'],createdAt:now()-d*7,updatedAt:now()-h*30},
      {id:'n2',title:'Vergonha vs culpa',body:'Culpa é "fiz algo ruim". Vergonha é "eu sou ruim". A ==vergonha corrói a autoestima==; a culpa pode ser construtiva.',folderId:'b1',status:'kept',tags:['vergonha','emoções'],createdAt:now()-d*6,updatedAt:now()-h*20},
      {id:'n3',title:'Wholehearted living',body:'Viver de forma plena = cultivar **autocompaixão** e pertencimento. Liga direto com [[Vulnerabilidade é coragem]].',folderId:'b1',status:'kept',tags:['coragem','autocompaixão'],createdAt:now()-d*5,updatedAt:now()-h*10},
      {id:'n4',title:'Revolução Cognitiva',body:'Há ~70 mil anos o Homo sapiens passou a criar **ficções compartilhadas** (mitos, dinheiro, nações) — a base da cooperação em massa.',folderId:'b2',status:'kept',tags:['história','cognição'],createdAt:now()-d*4,updatedAt:now()-h*8},
      {id:'n5',title:'Dinheiro é confiança',body:'O dinheiro é a ficção mais universal: só funciona porque ==todos confiam== que os outros vão aceitá-lo. Deriva da [[Revolução Cognitiva]].',folderId:'b2',status:'kept',tags:['história','economia'],createdAt:now()-d*3,updatedAt:now()-h*5},
      {id:'n6',title:'Escrever fixa o aprendizado',body:'Anotar com as próprias palavras força a compreensão — princípio do Zettelkasten de Luhmann.',folderId:'g1',status:'kept',tags:['aprendizado','zettelkasten'],createdAt:now()-d*2,updatedAt:now()-h*3},
      {id:'n7',title:'Ditar notas por voz no Kindle',body:'Ideia: testar capturar por voz enquanto leio, sem tirar os olhos do livro.',folderId:'inbox',status:'inbox',tags:[],createdAt:now()-h*2,updatedAt:now()-h*2}
    ];

  /* ============ boot ============ */
  function boot(){
    if(DEMO){ session={user:{id:'demo'}}; uid='demo'; conn='ok'; hideAuth(); seedDemo(); view={name:'folder',folderId:'b1',noteId:null,tag:null,q:''}; render(); return; }
    if(!window.supabase||!window.supabase.createClient){ document.body.innerHTML='<div style="padding:40px;text-align:center;font-family:sans-serif">Falha ao carregar a biblioteca. Verifique sua conexão e recarregue.</div>'; return; }
    sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
    setSignMode('in');
    $('#authBtn').onclick=doAuth;
    $('#authPass').addEventListener('keydown',function(e){if(e.key==='Enter')doAuth();});
    $('#authEmail').addEventListener('keydown',function(e){if(e.key==='Enter')$('#authPass').focus();});
    if(location.hash.indexOf('type=recovery')>=0) recovering=true;
    sb.auth.getSession().then(function(r){
      if(recovering){ showAuth(); setSignMode('recover'); return; }
      if(r.data&&r.data.session){ onSignedIn(r.data.session); } else { showAuth(); }
    });
    sb.auth.onAuthStateChange(function(ev,s){
      if(ev==='PASSWORD_RECOVERY'){ recovering=true; showAuth(); setSignMode('recover'); return; }
      if(recovering) return;
      if(s&&s.user){ if(!session||session.user.id!==s.user.id) onSignedIn(s); }
      else { onSignedOut(); }
    });
  }
  boot();
})();
